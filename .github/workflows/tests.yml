name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths: ["collector/**", "config/**", "tests/**", "requirements.txt"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
