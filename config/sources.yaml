# Job boards the daily collector checks.
#
# type: madgex        Boards built on the Madgex platform. They offer keyword RSS
#                     at <base>/jobsrss/?keywords=... and every job page carries
#                     schema.org JobPosting data (dates, location, description).
# type: hej_category  HigherEdJobs' official per-category RSS feeds. The feed only
#                     has title + institution + location, so the collector opens
#                     each faculty-looking posting once to read its description.
# type: listing       Search-result or category pages (HTML) that link to job pages
#                     with schema.org JobPosting data. "{keyword}" in a url is
#                     replaced by each keyword below, "{page}" by 1..pages.
# type: rss           A plain RSS job feed (latest postings only).
# type: euraxess      EURAXESS job pages, read by job number (see the source below).
#
# Before adding a board, check its robots.txt and terms: the collector obeys
# robots.txt (including * and $ wildcards) and never works around blocks.
#
# Set enabled: false to switch a source off. A source that fails (blocked,
# changed format, offline) is skipped and reported on the website's
# "Sources" panel; the rest of the run continues.

settings:
  # Seconds to wait between requests to the same site. Please be polite.
  delay_seconds: 1.5
  # Maximum RSS pages per keyword query (20 results per page on Madgex).
  max_pages: 5
  # Re-open an active posting's page to refresh its dates every N days.
  refresh_days: 7
  # A posting not seen in any feed for this many days is marked as closed.
  stale_days: 10
  # Most posting pages opened in one run (all sources together).
  max_detail_fetches: 2000

# Searched on every Madgex board. Board search is broad; the collector then
# keeps only postings whose text matches config/taxonomy.yaml.
keywords:
  - microbiome
  - microbiota
  - metagenomics
  - microbial ecology
  - host-microbe
  - holobiont
  - rhizosphere
  - phytobiome

sources:
  - id: sciencecareers
    name: Science Careers (AAAS)
    type: madgex
    base: https://jobs.sciencecareers.org
    enabled: true

  - id: naturecareers
    name: Nature Careers
    type: madgex
    base: https://www.nature.com/naturecareers
    # Off: nature.com's robots.txt disallows its job RSS feeds and job search for
    # automated tools. Individual job pages are allowed and listed in
    # https://www.nature.com/naturecareers/sitemapindex.xml, so a sitemap-based
    # reader would be the rules-compliant way to add it back.
    enabled: false

  - id: chronicle
    name: The Chronicle of Higher Education Jobs
    type: madgex
    base: https://jobs.chronicle.com
    enabled: true

  - id: insidehighered
    name: Inside Higher Ed Careers
    type: madgex
    base: https://careers.insidehighered.com
    enabled: true

  - id: the_unijobs
    name: Times Higher Education Unijobs
    # THE's robots.txt disallows its job RSS feeds, so read its search pages instead.
    type: listing
    base: https://www.timeshighereducation.com
    urls:
      - "/unijobs/listings/?keywords={keyword}&page={page}"
    link_pattern: '/unijobs/listing/\d+/[a-z0-9\-]+'
    pages: 3
    enabled: true

  # ---------------------------------------------------------------- Europe
  - id: euraxess
    name: EURAXESS (European Commission)
    type: euraxess
    base: https://euraxess.ec.europa.eu
    # About 250 new jobs a day. Each run opens the new job pages, then works back
    # through older ones (up to backfill_ids numbers back) within max_per_run.
    # Only faculty-level jobs (researcher profile R3/R4, or a faculty title) that
    # mention microbiome terms are kept.
    max_per_run: 600
    backfill_ids: 7500
    enabled: true

  - id: jobs_ac_uk
    name: jobs.ac.uk (UK and Europe)
    type: listing
    base: https://www.jobs.ac.uk
    urls:
      - "/search/?keywords={keyword}&sortOrder=1&pageSize=100"
    link_pattern: '/job/[A-Z0-9]{5,}/[a-z0-9\-]+'
    deadline_from_valid_through: true
    enabled: true

  - id: academicpositions
    name: Academic Positions
    type: listing
    base: https://academicpositions.com
    # Category pages: position type x field.
    urls:
      - /jobs/position/professor/field/microbiology
      - /jobs/position/professor/field/biology
      - /jobs/position/professor/field/ecology
      - /jobs/position/professor/field/immunology
      - /jobs/position/professor/field/marine-biology
      - /jobs/position/professor/field/agricultural-science
      - /jobs/position/professor/field/environmental-science
      - /jobs/position/professor/field/food-science
      - /jobs/position/professor/field/bioinformatics
      - /jobs/position/professor/field/virology
      - /jobs/position/associate-professor/field/microbiology
      - /jobs/position/associate-professor/field/biology
      - /jobs/position/associate-professor/field/ecology
      - /jobs/position/associate-professor/field/immunology
      - /jobs/position/associate-professor/field/marine-biology
      - /jobs/position/associate-professor/field/agricultural-science
      - /jobs/position/associate-professor/field/environmental-science
      - /jobs/position/tenure-track/field/microbiology
      - /jobs/position/tenure-track/field/biology
      - /jobs/position/tenure-track/field/ecology
      - /jobs/position/tenure-track/field/immunology
      - /jobs/position/tenure-track/field/marine-biology
      - /jobs/position/tenure-track/field/agricultural-science
      - /jobs/position/tenure-track/field/environmental-science
      - /jobs/position/lecturersenior-lecturer/field/microbiology
      - /jobs/position/lecturersenior-lecturer/field/biology
      - /jobs/position/lecturersenior-lecturer/field/ecology
      - /jobs/position/lecturersenior-lecturer/field/immunology
      - /jobs/position/lecturersenior-lecturer/field/agricultural-science
    link_pattern: '/ad/[a-z0-9\-]+/\d{4}/[a-z0-9\-]+/\d+'
    deadline_from_valid_through: true
    enabled: true

  - id: universitypositions
    name: University Positions
    type: listing
    base: https://universitypositions.eu
    # Its RSS feed (/rss/) is disallowed in robots.txt; category pages are allowed.
    urls:
      - /jobs/microbiology
      - /jobs/professor
      - /jobs/assistant-professor
      - /jobs/associate-professor
      - /jobs/tenure-track
      - /jobs/lecturer
    link_pattern: '/jobs/\d{6,}-[a-z0-9\-]+'
    deadline_from_valid_through: true
    enabled: true

  - id: maxplanck
    name: Max Planck Society
    type: rss
    feeds:
      - https://www.mpg.de/feeds/jobs.rss
    enabled: true

  # Not read automatically (listed under "Where else to look" on the website):
  #  - academics.com: its robots.txt prohibits automated access without written permission.
  #  - AcademicTransfer (Netherlands): site was down for maintenance when checked (Nov 2026);
  #    check its robots.txt before adding.
  #  - academicjobs.com: its search ignores keywords and mostly returns grant notices.

  # ---------------------------------------------------------------- other
  - id: newscientist
    name: New Scientist Jobs
    type: madgex
    base: https://www.newscientist.com/jobs
    enabled: false   # mostly industry; switch on if useful

  - id: higheredjobs
    name: HigherEdJobs
    type: hej_category
    base: https://www.higheredjobs.com
    enabled: true
    # Faculty category feeds (catID -> category name on HigherEdJobs).
    categories:
      51: Animal Science
      52: Entomology
      54: Environmental Science, Ecology, and Forestry
      53: Food Science
      49: Plant and Soil Science
      57: Veterinary Medicine
      58: Other Agriculture Faculty
      111: Agricultural Engineering
      113: Biological and Biomedical Engineering
      115: Civil and Environmental Engineering
      185: Nutrition and Dietetics
      221: Public and Environmental Health
      138: Other Health Sciences Faculty
      181: Dentistry
      137: Medical Research
      154: Pharmacy and Pharmacology
      210: Other Medicine Faculty
      99: Biochemistry and Molecular Biology
      100: Biology
      290: Data Science
      170: Geology, Earth Sciences, and Oceanography
      108: Other Science Faculty

# Anyone can add a posting that the boards miss: put its URL on its own line in
# data/submitted_urls.txt (or open a "Submit a position" issue). The collector
# reads it like any other posting and applies the same filters.
