# Classification rules used by the collector.
#
# Everything here is plain keyword / regular-expression matching, so anyone can
# improve the filters with a pull request — no code changes needed.
# Patterns are case-insensitive Python regular expressions matched against the
# posting's title + full description text.

# A posting is kept only if it mentions at least one of these terms.
microbiome_terms:
  - 'microbiom\w*'            # microbiome, microbiomes
  - 'microbiota\w*'
  - 'metagenom\w*'
  - 'metatranscriptom\w*'
  - 'microbial ecolog\w*'
  - 'microbial communit\w*'
  - 'host[\s\-–]+microb\w*'   # host-microbe, host–microbiome
  - 'holobiont\w*'
  - 'phytobiome\w*'
  - 'rhizosphere'
  - 'viromes?\b'
  - 'mycobiom\w*'
  - 'microbial symbio\w*'
  - 'gut microb\w*'
  - 'commensal (?:bacteri|microb)\w*'
  # Other European languages (postings on EURAXESS and national boards)
  - 'mikrobiom\w*'            # German, Nordic, Czech, Polish
  - 'mikrobiot\w*'
  - 'microbiot[ae]\w*'         # French microbiote, Italian/Spanish microbiota
  - 'microbioom\w*'           # Dutch
  - 'microbioma\w*'           # Spanish, Italian, Portuguese
  - 'm[ée]tag[ée]nom\w*'       # French métagénomique
  - 'holobionte?n?\b'
  # Japanese, Chinese, Korean (no word boundaries in these scripts)
  - 'マイクロバイオーム|微生物叢|細菌叢|腸内細菌|腸内フローラ|メタゲノム'
  - '微生物组|微生物群落|肠道菌群|宏基因组|微生态'
  - '마이크로바이옴|미생물군|장내\s?미생물|메타게놈'

# Job titles must look like a faculty position...
faculty_title_patterns:
  - '\bprofessor\w*'
  - '\bprof\.'
  - '\bfaculty\b'
  - '\bopen[\s\-]rank\b'
  - '\btenure'
  - '\blecturer\b'
  - '\breader\b'
  - '\bprincipal investigator\b'
  - '\bgroup leader\b'
  - '\bjunior research group\b'
  - '\b(?:assistant|associate|full) member\b'
  - '\bchair\b'
  - '\binvestigator\b'
  - '\bclinician[\s\-]scientist\b'
  - '\bphysician[\s\-]scientist\b'
  # European titles
  - '\b(?:junior)?professur\w*'          # German Professur, Juniorprofessur
  - '\bW\s?[123]\b'                       # German professorship grades W1-W3
  - '\bhoogleraar\b'                     # Dutch full professor
  - '\buniversitair (?:hoofd)?docent\b'  # Dutch assistant / associate professor
  - '\bdocent\b'                         # Nordic / Central European associate professor
  - '\b\w*lektor(?:at)?\b'                # universitetslektor, lektor
  - '\bma[iî]tre de conf[ée]rences\b'    # French
  - '\bprofesseur\w*'                    # French
  - '\bprofesor\w*|\bprofessore\b'       # Spanish, Italian, Portuguese
  - '\bcharg[ée]e? de recherche\b'       # French permanent researcher (CNRS, INRAE)
  - '\bdirect(?:eur|rice) de recherche\b'
  - '\bnachwuchsgruppenleit\w*'          # junior research group leader
  # Japanese, Chinese, Korean
  - '教授|准教授|講師|助教|教員'           # ja (zh shares 教授)
  - '副教授|讲师|助理教授|长聘|预聘|教职'   # zh
  - '교수|전임교원'                        # ko

# ...and must not look like one of these (checked against the title only).
exclude_title_patterns:
  - '\bpost[\s\-]?doc\w*'
  - '\bpostdoctoral\b'
  - '\bgraduate (?:student|assistant)\b'
  - '\bph\.?d\.?\s+(?:student|candidate|position|studentship)'
  - '\bdoctoral (?:student|candidate|researcher)\b'
  - '\bstudentship\b'
  - '\btechnician\b'
  - '\bresearch (?:assistant|associate|scientist|technologist|specialist|coordinator)\b(?!\s+professor)'
  - '\bstaff scientist\b'
  - '\blab(?:oratory)? manager\b'
  - '\badjunct\b'
  - '\bpart[\s\-]time\b'
  - '\bintern(?:ship)?\b'
  - '\bfellow(?:ship)?\b(?!.*professor)'
  - '\bvisiting\b'
  - '\bemeritus\b'
  # European non-faculty titles
  - '\bdoktorand\w*|\bpromovend\w*|\bdoctorant\w*|\bdoctoral (?:position|researcher|student)s?\b'
  - '\bwissenschaftliche[rns]? mitarbeiter\w*'   # research associate (usually PhD/postdoc)
  - '\buniversit(?:y|äts)\s?assistent\w*|\buniversity assistant\b'
  - '\bstudent(?:ische)? (?:assistant|hilfskraft)\b'
  - '\baios\b'                                    # Dutch medical resident
  - 'ポスドク|博士研究員|研究補助|技術職員|技術補佐|事務|パート|アルバイト|非常勤|学術専門職員'   # ja
  - '博士后|博士後|研究助理|技术员|行政'                                                     # zh
  - '박사후|시간강사|행정'                                                                    # ko

# Research domains. A posting can belong to several.
# label: shown on the website; color: map marker / chip color.
domains:
  human_health:
    label: Human health
    color: '#c2410c'
    patterns:
      - '\bhuman (?:health|disease|microbiome|gut)\b'
      - '\bclinical\b'
      - '\bpatients?\b'
      - '\bmedicine\b'
      - '\bmedical\b'
      - '\bcancer\b'
      - '\boncolog\w*'
      - '\bimmunolog\w*'
      - '\bgastroenterolog\w*'
      - '\binfectious disease\w*'
      - '\bpublic health\b'
      - '\bepidemiolog\w*'
      - '\bpediatric\w*'
      - '\bwomen.s health\b'
      - '\bnutrition\w*'
      - '\bmetabolic disease\w*'
      - '\bobesity\b'
      - '\bdiabet\w*'
      - '\bneuro\w*'
      - '\boral (?:health|microbio\w*)'
      - '\bdent(?:al|istry)\b'
      - '\bpathology\b'
      - '\bpharmac\w*'
      - '\bantimicrobial resistance\b'
  animal_health:
    label: Animal health
    color: '#b45309'
    patterns:
      - '\bveterinar\w*'
      - '\banimal (?:health|science\w*|nutrition|agricultur\w*|production|microbio\w*)'
      - '\blivestock\b'
      - '\bpoultry\b'
      - '\bswine\b'
      - '\bpigs?\b'
      - '\bcattle\b'
      - '\bbovine\b'
      - '\bruminan\w*'
      - '\bdairy\b'
      - '\bcompanion animals?\b'
      - '\bwildlife\b'
      - '\bzoonot\w*'
      - '\bone health\b'
      - '\bcomparative (?:medicine|biomedical)\b'
  ocean:
    label: Ocean & marine
    color: '#0369a1'
    patterns:
      - '\bocean\w*'
      - '\bmarine\b'
      - '\bcoral\w*'
      - '\bseawater\b'
      - '\bcoastal\b'
      - '\bestuar\w*'
      - '\bsea\b'
      - '\bdeep[\s\-]sea\b'
      - '\bphytoplankton\b'
      - '\bplankton\w*'
      - '\bsponges?\b'
  aquaculture:
    label: Aquaculture & fisheries
    color: '#0e7490'
    patterns:
      - '\baquacultur\w*'
      - '\bmaricultur\w*'
      - '\bfisher(?:y|ies)\b'
      - '\bfish (?:health|disease|nutrition|pathology)\b'
      - '\bshellfish\b'
      - '\boysters?\b'
      - '\bshrimp\b'
      - '\bsalmon\w*'
      - '\baquatic animal\w*'
  soil:
    label: Soil
    color: '#78350f'
    patterns:
      - '\bsoils?\b'
      - '\brhizosphere\b'
      - '\bterrestrial (?:ecosystem|biogeochem)\w*'
      - '\bpedolog\w*'
  plant:
    label: Plant
    color: '#15803d'
    patterns:
      - '\bplants?\b'
      - '\bphytobiome\w*'
      - '\bplant patholog\w*'
      - '\bcrops?\b'
      - '\broots?\b'
      - '\bphyllosphere\b'
      - '\bendophyt\w*'
      - '\bforest\w*'
      - '\bhorticultur\w*'
      - '\bbotan\w*'
  agriculture:
    label: Agriculture
    color: '#65a30d'
    patterns:
      - '\bagricultur\w*'
      - '\bagronom\w*'
      - '\bagroecolog\w*'
      - '\bfarm\w*'
      - '\bcrop (?:production|science|protection)\b'
      - '\blivestock\b'
      - '\bfood (?:production|security|systems?)\b'
      - '\bsustainable ag\w*'
  food:
    label: Food & fermentation
    color: '#a16207'
    patterns:
      - '\bfood science\w*'
      - '\bfood safety\b'
      - '\bfoodborne\b'
      - '\bfermentation\w*'
      - '\bfermented\b'
      - '\bprobiotic\w*'
      - '\bprebiotic\w*'
  environment:
    label: Environment & climate
    color: '#4d7c0f'
    patterns:
      - '\benvironmental (?:microbio\w*|science\w*|engineering|health)\b'
      - '\bfreshwater\b'
      - '\blakes?\b'
      - '\brivers?\b'
      - '\bwastewater\b'
      - '\bbiogeochem\w*'
      - '\bclimate\b'
      - '\bbuilt environment\b'
      - '\bbioremediat\w*'
      - '\becosystem\w*'
      - '\bpermafrost\b'
  computational:
    label: Computational & data
    color: '#6d28d9'
    patterns:
      - '\bbioinformatic\w*'
      - '\bcomputational\b'
      - '\bdata science\b'
      - '\bmachine learning\b'
      - '\bartificial intelligence\b'
      - '\b(?:AI|ML)\b'
      - '\bsystems biology\b'
      - '\bmulti[\s\-]?omics?\b'
  fundamental:
    label: Microbiology & ecology (general)
    color: '#475569'
    patterns:
      - '\bmicrobiolog\w*'
      - '\bmicrobial (?:ecology|evolution|physiology|genetics|genomics)\b'
      - '\bsymbios\w*'
      - '\bevolution\w*'
      - '\bvirolog\w*'
      - '\bmycolog\w*'

# Domains that need a stronger signal: a posting is tagged with one of these only
# if at least this many distinct patterns from it match (cuts false positives
# like "root cause" -> plant, or one passing mention of "climate").
min_hits:
  human_health: 2
  plant: 2
  environment: 2
  computational: 1
  fundamental: 1
  default: 1

# ---------------------------------------------------------------------------
# Method flags, shown as extra tags and filters next to the research areas.
# A flag is set when any of its patterns appears in the title or description.
method_flags:
  bioinformatics:
    label: Bioinformatics
    patterns:
      - '\bbioinformatic\w*'
      - '\bcomputational (?:biolog\w*|genomics|microbiolog\w*|ecolog\w*|immunolog\w*|biomedicine|life sciences?)'
      - '\b(?:genomic|sequencing|sequence|omics|microbiome|metagenomic) data (?:science|analysis|analytics|integration)'
      - '\b(?:analysis|analyses|analyzing|analysing) of (?:large[\s\-]scale |high[\s\-]throughput )?(?:sequencing|genomic|omics|metagenomic|microbiome) data'
      - '\bdata[\s\-]driven (?:biology|microbiology|life sciences?)'
      - '\bmachine[\s\-]learning\b|\bdeep[\s\-]learning\b|\bartificial intelligence\b'
      - '\bdata science\b'
      - '\bstatistical genomics\b|\bgenome informatics\b|\bphylogenomic\w*'
      - '\bsystems biology\b|\bmathematical modell?ing\b'
      - '\bbioinformatik\w*|\bbioinformatique\b|\bbioinform[áa]tica\b|\bbioinformatica\b'
      - 'バイオインフォマティクス|生物信息学|생물정보학'
  multi_omics:
    label: Multi-omics
    # Set when one of these appears, or when two or more of the omics layers below do.
    patterns:
      - '\bmulti[\s\-]?omics?\b|\bmultiomic\w*'
      - '\bintegrat\w* (?:of )?(?:multiple |multi[\s\-]layer |several )?omics\b|\bintegrative omics\b|\bpan[\s\-]omics\b'
      - 'マルチオミクス|多组学|멀티오믹스'
    # Omics layers listed on each position's page.
    layers:
      metagenomics: '\bmetagenom\w*|\bshotgun sequencing\b|メタゲノム|宏基因组|메타게놈'
      metatranscriptomics: '\bmetatranscriptom\w*'
      metaproteomics: '\bmetaproteom\w*'
      genomics: '\b(?<!meta)genomics\b|\bwhole[\s\-]genome sequencing\b'
      transcriptomics: '\b(?<!meta)transcriptom\w*|\bRNA[\s\-]?seq\b|\bsingle[\s\-]cell (?:RNA|sequencing|genomics)'
      proteomics: '\b(?<!meta)proteom\w*'
      metabolomics: '\bmetabolom\w*|\bmetabonom\w*|\blipidom\w*'
      epigenomics: '\bepigenom\w*|\bmethylom\w*'
      spatial omics: '\bspatial (?:transcriptom\w*|omics|proteom\w*)'
      amplicon / 16S: '\b16S rRNA\b|\bamplicon sequencing\b|\bITS sequencing\b'
